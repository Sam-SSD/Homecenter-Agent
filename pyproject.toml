[project]
name = "homecenter-agent"
version = "0.1.0"
description = "Cotizador de remodelacion (bano, cocina, habitacion, sala) con productos reales de Homecenter Colombia"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "streamlit>=1.35",
]

[tool.setuptools]
packages = ["dominio", "agentes", "config", "ingesta", "pruebas"]
